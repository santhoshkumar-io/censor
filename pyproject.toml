[project]
name = "censor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santhoshkumar", email = "santhoshkumars1903@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "better-profanity>=0.7.0",
    "celery>=5.7.0",
    "fastapi[all]>=0.165.0",
    "greenlet>=3.5.6",
    "profanity>=1.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pydub>=0.25.1",
    "pyjwt>=2.15.1",
    "redis>=8.2.0",
    "scalar-fastapi>=1.11.0",
    "sqlmodel>=0.0.50",
    "whisperx>=3.8.6",
]

[project.scripts]
censor = "censor:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]

[tool.poe.tasks]

worker = "uv run celery -A app.worker.tasks worker --loglevel=INFO --pool=solo"
